<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headless AI-Native ERP Architecture</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --fg-text: #1e293b;
      --fg-muted: #64748b;
      --border: #e2e8f0;
      --code-bg: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 20px;
      background: var(--bg-page);
      color: var(--fg-text);
      font-family: "Leelawadee UI", "Segoe UI Variable", "Segoe UI", "Sarabun", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 1895px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg-muted);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .toggle-btn:hover {
      color: var(--fg-text);
      border-color: var(--fg-muted);
    }
    .pikchr-svg {
      width: 100%;
      overflow-x: auto;
      display: flex;
      justify-content: center;
    }
    .pikchr-svg svg {
      max-width: 100%;
      height: auto;
      font-family: "Leelawadee UI", "Segoe UI Variable", "Segoe UI", "Sarabun", sans-serif;
      text-rendering: optimizeLegibility;
      font-feature-settings: "mark" 1, "mkmk" 1, "ccmp" 1;
    }
    .pikchr-editor-wrap {
      display: none;
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .show-source .pikchr-editor-wrap {
      display: block;
    }
    .editor-label {
      font-size: 12px;
      color: var(--fg-muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .pikchr-textarea {
      width: 100%;
      min-height: 220px;
      background: var(--code-bg);
      color: var(--fg-text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: "Cascadia Mono", "Consolas", "Geist Mono", monospace;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
    }
    .pikchr-err {
      display: none;
      margin-top: 8px;
      padding: 10px 12px;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 6px;
      font-family: "Cascadia Mono", "Consolas", "Geist Mono", monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>

charht = 0.16in

# ============================================================================
# Column 1: Multi-Agent Clients (1 User : N Personal Agent Tokens)
# ============================================================================
down
A1: box &quot;Antigravity IDE&quot; &quot;(erp_pat_antigravity_...)&quot; bold wid 2.15in ht 0.54in fill white color 0x1d4ed8
move 0.15in
A2: box &quot;Claude Desktop&quot; &quot;(erp_pat_claude-desktop_...)&quot; bold wid 2.15in ht 0.54in fill white color 0x1d4ed8
move 0.15in
A3: box &quot;Claude Code&quot; &quot;(erp_pat_claude-code_...)&quot; bold wid 2.15in ht 0.54in fill white color 0x1d4ed8
move 0.15in
A4: box &quot;DSH / Custom Agent&quot; &quot;(Scoped / Read-Only PAT)&quot; bold wid 2.15in ht 0.54in fill white color 0x1d4ed8

# ============================================================================
# Column 2: Headless ERP MCP Server (Zero Direct Table Mutation)
# ============================================================================
MCP: box &quot;ERP MCP Server&quot; &quot;(TypeScript / Stdio / HTTP)&quot; &quot;Zero Direct Table Access&quot; bold wid 2.3in ht 0.88in fill white color 0x15803d \
     with .w at 0.95in right of 0.5&lt;A2.e,A3.e&gt;

RLSBlock: box &quot;Direct Table REST API&quot; &quot;RLS: USING (false) Blocked!&quot; small wid 2.3in ht 0.56in fill 0xfef2f2 color 0xb91c1c \
          with .n at 0.35in below MCP.s

# ============================================================================
# Column 3: Supabase Fat Database Engine (PL/pgSQL SECURITY DEFINER RPCs)
# ============================================================================
AuthRPC: box &quot;fn_authenticate_and_authorize()&quot; &quot;SHA-256 PAT + Dynamic RBAC&quot; bold wid 2.55in ht 0.62in fill white color 0xb45309 \
         with .w at 1.05in right of (MCP.e + (0, 0.75in))

MakerRPC: box &quot;Maker RPCs (สร้างชุดร่าง)&quot; &quot;rpc_create_journal_draft&quot; &quot;rpc_create_inventory_doc_draft&quot; wid 2.55in ht 0.72in fill white color 0x1d4ed8 \
          with .n at 0.24in below AuthRPC.s

CheckerRPC: box &quot;Checker RPCs (อนุมัติ/Post)&quot; &quot;Maker != Checker + วงเงินอนุมัติ&quot; &quot;SUM(Debit) = SUM(Credit)&quot; wid 2.55in ht 0.72in fill white color 0x15803d \
            with .n at 0.24in below MakerRPC.s

# ============================================================================
# Column 4: Immutable Ledgers &amp; Dual-Identity Audit Trail
# ============================================================================
GL: cylinder &quot;Immutable GL Ledger&quot; &quot;(gl_entries + vouchers)&quot; &quot;Block UPDATE / DELETE&quot; bold wid 2.25in ht 0.74in fill white color 0x854d0e \
    with .w at 0.95in right of AuthRPC.e

INV: cylinder &quot;Immutable Inventory&quot; &quot;(inventory_transactions)&quot; &quot;Auto-Post Linked GL&quot; bold wid 2.25in ht 0.74in fill white color 0x854d0e \
     with .n at 0.24in below GL.s

AUDIT: cylinder &quot;Dual-Identity Audit&quot; &quot;(audit_logs + heartbeats)&quot; &quot;User ID + Agent Client&quot; bold wid 2.25in ht 0.74in fill white color 0x334155 \
       with .n at 0.24in below INV.s

# ============================================================================
# Background Zones (Drawn BEHIND A1)
# ============================================================================
ZoneClients: box wid A1.wid + $margin \
             ht (A1.n.y - A4.s.y) + $margin*1.65 \
             at 0.08in above 0.5&lt;A1.n,A4.s&gt; \
             fill 0xeff6ff color 0x93c5fd behind A1
text &quot;1. AI Clients (1 User : N PATs)&quot; bold small color 0x1d4ed8 with .n at 0.05in below ZoneClients.n

ZoneMCP: box wid MCP.wid + $margin \
         ht (MCP.n.y - RLSBlock.s.y) + $margin*1.7 \
         at 0.08in above 0.5&lt;MCP.n,RLSBlock.s&gt; \
         fill 0xf0fdf4 color 0x86efac behind A1
text &quot;2. MCP Gateway Layer&quot; bold small color 0x15803d with .n at 0.05in below ZoneMCP.n

ZoneRPC: box wid AuthRPC.wid + $margin \
         ht (AuthRPC.n.y - CheckerRPC.s.y) + $margin*1.65 \
         at 0.08in above 0.5&lt;AuthRPC.n,CheckerRPC.s&gt; \
         fill 0xfef3c7 color 0xfcd34d behind A1
text &quot;3. Fat Database (PL/pgSQL RPCs)&quot; bold small color 0xb45309 with .n at 0.05in below ZoneRPC.n

ZoneLedger: box wid GL.wid + $margin \
            ht (GL.n.y - AUDIT.s.y) + $margin*1.65 \
            at 0.08in above 0.5&lt;GL.n,AUDIT.s&gt; \
            fill 0xfefce8 color 0xfde047 behind A1
text &quot;4. Immutable PostgreSQL Ledgers&quot; bold small color 0x854d0e with .n at 0.05in below ZoneLedger.n

# ============================================================================
# Connectors &amp; Flows
# ============================================================================
arrow from A1.e right 0.35in then down until even with (MCP.w + (0, 0.16in)) then to (MCP.w + (0, 0.16in)) color 0x1d4ed8
arrow from A2.e right 0.2in then down until even with (MCP.w + (0, 0.05in)) then to (MCP.w + (0, 0.05in)) color 0x1d4ed8
arrow from A3.e right 0.2in then up until even with (MCP.w + (0, -0.05in)) then to (MCP.w + (0, -0.05in)) color 0x1d4ed8
arrow from A4.e right 0.35in then up until even with (MCP.w + (0, -0.16in)) then to (MCP.w + (0, -0.16in)) color 0x1d4ed8

arrow from MCP.s to RLSBlock.n dashed color 0xb91c1c

arrow from MCP.e right 0.42in &quot; rpc_*()&quot; ljust small bold \
  then up until even with AuthRPC.w \
  then to AuthRPC.w color 0x15803d

arrow from AuthRPC.s to MakerRPC.n color 0xb45309

  <script>
  (function() {

    var errBox = document.getElementById('pikchr-error');
    var darkMode = false;
    var pad = 12.0;
    var bgColor = "#ffffff";
